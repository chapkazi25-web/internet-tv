name: Update M3U

on:
  schedule:
    - cron: "30 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild organized playlist
        run: python3 update_playlist.py --out-dir output --split --check-streams

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md output/playlist.m3u output/categories/ output/source.m3u8
          git rm -q --cached --ignore-unmatch output/category-report.md || true
          git diff --cached --quiet || git commit -m "Update M3U playlist ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
